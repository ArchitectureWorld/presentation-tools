# refreshed after production layout integration
name: Temporary Report Studio Source Snapshot

on:
  push:
    branches:
      - feat/report-studio-v0.2.0-layout
    paths:
      - .github/workflows/report-studio-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Archive current checkout and dependencies
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$RUNNER_TEMP/report-studio-source-${GITHUB_SHA}.tgz"
          deps_archive="$RUNNER_TEMP/report-studio-node-modules-${GITHUB_SHA}.tgz"
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='**/node_modules' \
            --exclude='.worktrees' \
            -czf "$source_archive" \
            -C "$GITHUB_WORKSPACE" .
          tar -czf "$deps_archive" -C "$GITHUB_WORKSPACE" node_modules
          sha256sum "$source_archive" "$deps_archive" | sed "s#${RUNNER_TEMP}/##" > "$RUNNER_TEMP/report-studio-source-${GITHUB_SHA}.sha256"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: report-studio-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/report-studio-source-${{ github.sha }}.tgz
            ${{ runner.temp }}/report-studio-node-modules-${{ github.sha }}.tgz
            ${{ runner.temp }}/report-studio-source-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 1
