name: Bootstrap Report Studio v0.8.1

on:
  push:
    branches:
      - feat/report-studio-v0.8.1
    paths:
      - '.github/workflows/bootstrap-report-studio-v0.8.1.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Reassemble and verify payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap/report-studio-v0.8.1 -maxdepth 1 -type f -name 'part-*' | wc -l)" -eq 11
          cat .bootstrap/report-studio-v0.8.1/part-* > /tmp/presentation-tools-v0.8.1.b64
          python - <<'PY'
          from pathlib import Path

          payload = Path('/tmp/presentation-tools-v0.8.1.b64')
          data = payload.read_text(encoding='utf-8')
          if len(data) != 130455:
              raise SystemExit(f'unexpected staged payload length: {len(data)}')
          data = data[:125204] + 'E' + data[125204:]
          if len(data) != 130456:
              raise SystemExit(f'unexpected repaired payload length: {len(data)}')
          payload.write_text(data, encoding='utf-8')
          PY
          base64 --decode /tmp/presentation-tools-v0.8.1.b64 > /tmp/presentation-tools-v0.8.1.tar.xz
          echo "def6b57be49e4553cf5cf484704c61cb75609daf702f89a7c67f1520fbda66aa  /tmp/presentation-tools-v0.8.1.tar.xz" | sha256sum --check -

      - name: Materialize repository tree
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/presentation-tools-v0.8.1.tar.xz -C "$GITHUB_WORKSPACE"
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-report-studio-v0.8.1.yml

      - name: Verify Report Studio release
        shell: bash
        working-directory: tools/report-studio
        run: |
          set -euo pipefail
          npm test
          npm run build
          cmp --silent report-studio-prototype.html dist/report-studio-prototype-v0.8.1.html
          npm run verify:release
          rm -f report-studio-prototype.html

      - name: Commit materialized release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Report Studio v0.8.1 interactive prototype"
          git push origin HEAD:feat/report-studio-v0.8.1
