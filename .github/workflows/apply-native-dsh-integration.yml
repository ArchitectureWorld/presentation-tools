          ```bash
          corepack enable
          dsh plugin --profile web add ./packages/studio-dsh-plugin
          dsh --profile web --dump-config
          dsh --profile web --no-open
          ```

          正式 DSH 模式不依赖 `REPORT_STUDIO_AGENT_URL` 或独立 4173 服务。

          验证：

          ```bash
          npm run verify:all
          npm run smoke:dsh
          ```

          `v0.2.0` 再开发正式排版画布，本轮不改变该边界。
          ''')
