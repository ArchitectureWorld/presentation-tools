name: Apply native DSH integration

on:
  push:
    branches:
      - integration/report-studio-mvp-v0.1.0
    paths:
      - '.github/workflows/apply-native-dsh-integration.yml'

permissions:
  contents: write

concurrency:
  group: apply-native-dsh-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --version

      - name: Write native DSH plugin and deployment files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import textwrap

          def write(path, content):
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(textwrap.dedent(content).lstrip(), encoding='utf-8')

          write('packages/studio-dsh-plugin/package.json', r'''
          {
            "name": "@architectureworld/report-studio-dsh",
            "version": "0.1.0",
            "description": "Report Studio v0.1.0 native DSH Web profile plugin",
            "type": "module",
            "main": "lib/index.js",
            "exports": {
              ".": "./lib/index.js",
              "./client": "./lib/client.js",
              "./cordis.patch.yml": "./cordis.patch.yml",
              "./package.json": "./package.json"
            },
            "files": [
              "lib/**",
              "compatibility/**",
              "cordis.patch.yml",
              "README.md"
            ],
            "dsh": {
              "bundle": {
                "patch": "./cordis.patch.yml"
              },
              "client": {
                "platform": "web",
                "inject": []
              }
            },
            "engines": {
              "node": ">=22"
            },
            "dependencies": {
              "@deepseek-ai/dsh-tools": "0.1.1-rc.2"
            },
            "peerDependencies": {
              "@deepseek-ai/cordis": "4.0.1"
            },
            "license": "MIT"
          }
          ''')

          write('packages/studio-dsh-plugin/cordis.patch.yml', r'''
          - insert:
              - id: report-studio-dsh
                name: '@architectureworld/report-studio-dsh'
          ''')

          write('packages/studio-dsh-plugin/compatibility/dsh-baseline.json', r'''
          {
            "plugin": "@architectureworld/report-studio-dsh",
            "pluginVersion": "0.1.0",
            "testedDshVersion": "0.1.1-rc.2",
            "testedProfile": "web",
            "hostServices": ["tools", "webServer", "systemPrompt"],
            "clientServices": ["slots", "sessions"],
            "routes": ["/report-studio"],
            "tools": ["studio_get_context", "studio_apply_commands"]
          }
          ''')

          write('packages/studio-dsh-plugin/README.md', r'''
          # `@architectureworld/report-studio-dsh` v0.1.0

          Report Studio 的 DSH 原生组合包。它在 DSH Web Profile 中注册：

          - `Report Studio` 会话视图；
          - 会话头部 `Report Studio` 入口；
          - `/report-studio` 同源 UI/API 路由；
          - `studio_get_context`；
          - `studio_apply_commands`；
          - 当前 DSH Session 的原生 `session.prompt(..., 'queue')` 通路。

          ## 安装

          在仓库根目录执行：

          ```bash
          dsh plugin --profile web add ./packages/studio-dsh-plugin
          dsh --profile web --dump-config
          dsh --profile web --no-open
          ```

          经过验证的 DSH 基线：`0.1.1-rc.2`。

          正式 DSH 模式不需要 `npm start`、`REPORT_STUDIO_AGENT_URL` 或外部 HTTP Bridge。

          完整说明见仓库根目录 [`DSH_INSTALL.md`](../../DSH_INSTALL.md)。
          ''')

          write('packages/studio-dsh-plugin/lib/runtime.js', r'''
          import { createHash } from 'node:crypto'
          import { homedir } from 'node:os'
          import { join, resolve } from 'node:path'
          import { createRepository } from '../../../apps/studio-local/repository.mjs'
          import {
            acceptProposal as acceptCoreProposal,
            createProposalFromAgent,
            executeAction as executeCoreAction,
            submitReviewRound,
          } from '../../studio-core/index.mjs'

          function cleanSessionId(value) {
            const sessionId = String(value ?? '').trim()
            if (!sessionId) throw Object.assign(new Error('缺少 DSH Session ID'), { statusCode: 400 })
            return sessionId
          }

          function sessionDirectoryName(sessionId) {
            return createHash('sha256').update(sessionId).digest('hex').slice(0, 32)
          }

          export function defaultDshDataRoot() {
            const dshHome = process.env.DSH_HOME?.trim() || join(homedir(), '.dsh')
            return join(dshHome, 'report-studio-v0.1.0')
          }

          function reviewPrompt(sessionId, state, round, submission) {
            return [
              '[Report Studio v0.1.0 · DSH Native Review]',
              `DSH Session ID: ${sessionId}`,
              `Project ID: ${state.project.id}`,
              `Project title: ${state.project.title}`,
              `Current revision: ${state.project.currentRevision}`,
              `ReviewRound ID: ${round.id}`,
              `ReviewSubmission ID: ${submission.id}`,
              `Submission number: ${submission.number}`,
              `Base revision: ${submission.baseRevision}`,
              '',
              '处理要求：',
              '1. 必须先调用 studio_get_context 读取当前会话绑定的 Report Studio 项目。',
              `2. 根据本次批注完成修改建议后，调用 studio_apply_commands，并将 submissionId 固定为 ${submission.id}。`,
              '3. studio_apply_commands 只创建 Proposal，不会直接覆盖正式内容；用户会在 Report Studio 中确认。',
              '4. 不要假定所有批注能一次解决；只处理有充分依据的修改。',
              '',
              '本次不可变 ReviewSubmission：',
              JSON.stringify(submission, null, 2),
            ].join('\n')
          }

          function chatPrompt(sessionId, state, input) {
            const text = String(input?.text ?? '').trim()
            if (!text) throw Object.assign(new Error('消息不能为空'), { statusCode: 400 })
            return [
              '[Report Studio v0.1.0 · DSH Native Chat]',
              `DSH Session ID: ${sessionId}`,
              `Project ID: ${state.project.id}`,
              `Project title: ${state.project.title}`,
              `Current revision: ${state.project.currentRevision}`,
              `Current stage: ${input?.stage || state.ui.stage}`,
              `Current page ID: ${input?.pageId || state.ui.activePageId || 'none'}`,
              '',
              '你正在当前 DSH Session 中协助用户处理 Report Studio 项目。需要读取项目时调用 studio_get_context。',
              '如用户要求修改正式内容，而当前上下文没有可关联的 ReviewSubmission，请先说明需要用户在界面中添加批注并“提给Agent”；不要绕过 Proposal/Revision 网关直接声称已修改。',
              '',
              `用户请求：${text}`,
            ].join('\n')
          }

          export function createStudioDshRuntime({ dataRoot = defaultDshDataRoot() } = {}) {
            const root = resolve(dataRoot)
            const repositories = new Map()

            async function repositoryFor(rawSessionId) {
              const sessionId = cleanSessionId(rawSessionId)
              let pending = repositories.get(sessionId)
              if (!pending) {
                pending = createRepository(join(root, 'sessions', sessionDirectoryName(sessionId)))
                repositories.set(sessionId, pending)
              }
              return pending
            }

            async function getState(sessionId) {
              return structuredClone((await repositoryFor(sessionId)).getState())
            }

            async function executeAction(sessionId, action) {
              const repository = await repositoryFor(sessionId)
              const result = executeCoreAction(repository.getState(), action)
              await repository.replace(result.state)
              return structuredClone(repository.getState())
            }

            async function submitReview(sessionId, input) {
              const id = cleanSessionId(sessionId)
              const repository = await repositoryFor(id)
              const submitted = submitReviewRound(repository.getState(), input)
              await repository.replace(submitted.state)
              return {
                state: structuredClone(repository.getState()),
                round: structuredClone(submitted.round),
                submission: structuredClone(submitted.submission),
                dshPrompt: {
                  kind: 'report_studio.review_submission',
                  sessionId: id,
                  text: reviewPrompt(id, submitted.state, submitted.round, submitted.submission),
                },
              }
            }

            async function prepareChat(sessionId, input) {
              const id = cleanSessionId(sessionId)
              const state = (await repositoryFor(id)).getState()
              return {
                dshPrompt: {
                  kind: 'report_studio.chat',
                  sessionId: id,
                  text: chatPrompt(id, state, input),
                },
              }
            }

            async function acceptProposal(sessionId, proposalId) {
              const repository = await repositoryFor(sessionId)
              const result = acceptCoreProposal(repository.getState(), proposalId)
              await repository.replace(result.state)
              return { state: structuredClone(repository.getState()), revision: structuredClone(result.revision) }
            }

            async function getContext(sessionId) {
              const id = cleanSessionId(sessionId)
              const state = await getState(id)
              const latestSubmission = state.reviewSubmissions.at(-1) ?? null
              return {
                contractVersion: 'report-studio.v0.1.0',
                sessionId: id,
                project: state.project,
                ui: state.ui,
                outline: state.outline,
                pages: state.pages,
                annotations: state.annotations,
                reviewRounds: state.reviewRounds,
                reviewSubmissions: state.reviewSubmissions,
                proposals: state.proposals,
                latestSubmissionId: latestSubmission?.id ?? null,
                writableCommands: [
                  'project.rename',
                  'outline.add',
                  'outline.rename',
                  'outline.move',
                  'outline.delete',
                  'draft.ensurePage',
                  'draft.update',
                ],
              }
            }

            async function applyCommands(sessionId, input) {
              const id = cleanSessionId(sessionId)
              const repository = await repositoryFor(id)
              const state = repository.getState()
              const submissionId = String(input?.submissionId ?? '').trim()
              if (!submissionId) throw new Error('submissionId 必填；请使用 ReviewSubmission 提示中的稳定 ID。')
              const submission = state.reviewSubmissions.find(item => item.id === submissionId)
              if (!submission) throw new Error(`ReviewSubmission '${submissionId}' 不存在于当前 DSH Session。`)
              const message = String(input?.message ?? '').trim()
              if (!message) throw new Error('message 必填。')
              if (!Array.isArray(input?.commands) || input.commands.length === 0) throw new Error('commands 必须至少包含一条结构化修改命令。')
              const proposed = createProposalFromAgent(state, submissionId, {
                message,
                commands: structuredClone(input.commands),
                sessionRef: id,
              })
              await repository.replace(proposed.state)
              return {
                proposalId: proposed.proposal.id,
                submissionId,
                reviewRoundId: submission.reviewRoundId,
                baseRevision: submission.baseRevision,
                status: proposed.proposal.status,
                currentRevision: repository.getState().project.currentRevision,
              }
            }

            return Object.freeze({
              dataRoot: root,
              repositoryFor,
              getState,
              executeAction,
              submitReview,
              prepareChat,
              acceptProposal,
              getContext,
              applyCommands,
            })
          }
          ''')

          write('packages/studio-dsh-plugin/lib/index.js', r'''
          import { readFile } from 'node:fs/promises'
          import { extname, join, normalize } from 'node:path'
          import { fileURLToPath } from 'node:url'
          import { defineTool } from '@deepseek-ai/dsh-tools'
          import { createStudioDshRuntime } from './runtime.js'

          export const name = 'report-studio-dsh'
          export const inject = ['tools', 'webServer', 'systemPrompt']

          const publicDir = fileURLToPath(new URL('../../../apps/studio-local/public/', import.meta.url))
          const contentTypes = {
            '.html': 'text/html; charset=utf-8',
            '.js': 'text/javascript; charset=utf-8',
            '.css': 'text/css; charset=utf-8',
            '.svg': 'image/svg+xml',
            '.png': 'image/png',
            '.jpg': 'image/jpeg',
            '.jpeg': 'image/jpeg',
            '.webp': 'image/webp',
          }

          function sendJson(response, status, value) {
            const body = JSON.stringify(value)
            response.statusCode = status
            response.setHeader('content-type', 'application/json; charset=utf-8')
            response.setHeader('content-length', Buffer.byteLength(body))
            response.setHeader('cache-control', 'no-store')
            response.end(body)
          }

          async function readJson(request, limit = 20 * 1024 * 1024) {
            const chunks = []
            let size = 0
            for await (const chunk of request) {
              size += chunk.length
              if (size > limit) throw Object.assign(new Error('请求体过大'), { statusCode: 413 })
              chunks.push(chunk)
            }
            if (!chunks.length) return {}
            try {
              return JSON.parse(Buffer.concat(chunks).toString('utf8'))
            } catch {
              throw Object.assign(new Error('JSON 格式错误'), { statusCode: 400 })
            }
          }

          function sessionIdFrom(url) {
            const value = url.searchParams.get('sessionId')?.trim()
            if (!value) throw Object.assign(new Error('缺少 DSH Session ID'), { statusCode: 400 })
            return value
          }

          function sessionIdOf(exec) {
            if (exec.agent === undefined) throw new Error('Report Studio 工具必须在 DSH Agent Session 中调用。')
            return String(exec.agent.id)
          }

          function outputJson(value) {
            return JSON.parse(JSON.stringify(value))
          }

          function toolOutput() {
            return {
              schema: { type: 'json' },
              render: (_args, value) => [{ type: 'text', text: JSON.stringify(value, null, 2) }],
            }
          }

          function registerTools(ctx, runtime) {
            ctx.tools.register(defineTool({
              name: 'studio_get_context',
              description: '读取当前 DSH Session 绑定的 Report Studio v0.1.0 大纲、草案、批注轮次、Submission、Proposal 与 Revision 上下文。修改前必须先调用。',
              parameters: {},
              output: toolOutput(),
              async execute(_args, exec) {
                return outputJson(await runtime.getContext(sessionIdOf(exec)))
              },
            }))

            ctx.tools.register(defineTool({
              name: 'studio_apply_commands',
              description: '根据一个不可变 ReviewSubmission 提交结构化修改命令并创建 Proposal。该工具不会直接覆盖正式内容，仍需用户在 Report Studio 中确认。',
              parameters: {
                submissionId: {
                  type: 'string',
                  required: true,
                  description: 'ReviewSubmission 提示中提供的稳定 ID。',
                },
                message: {
                  type: 'string',
                  required: true,
                  description: '面向用户的修改说明。',
                },
                commands: {
                  type: 'array',
                  required: true,
                  description: 'Report Studio 受控结构化命令数组。',
                  items: {
                    type: 'object',
                    additionalProperties: true,
                    properties: {
                      type: { type: 'string', required: true },
                    },
                  },
                },
              },
              output: toolOutput(),
              async execute(args, exec) {
                return outputJson(await runtime.applyCommands(sessionIdOf(exec), args))
              },
            }))
          }

          async function serveStatic(request, response, url) {
            if (request.method !== 'GET' && request.method !== 'HEAD') return false
            let relative = url.pathname.slice('/report-studio'.length)
            if (relative === '' || relative === '/') relative = '/index.html'
            const safe = normalize(relative).replace(/^([.][.][/\\])+/, '').replace(/^[/\\]+/, '')
            const filePath = join(publicDir, safe)
            if (!filePath.startsWith(publicDir)) return false
            try {
              const body = await readFile(filePath)
              response.statusCode = 200
              response.setHeader('content-type', contentTypes[extname(filePath).toLowerCase()] || 'application/octet-stream')
              response.setHeader('content-length', body.length)
              response.setHeader('x-content-type-options', 'nosniff')
              response.setHeader('cache-control', safe === 'index.html' ? 'no-store' : 'public, max-age=60')
              if (request.method === 'HEAD') response.end()
              else response.end(body)
              return true
            } catch (error) {
              if (error?.code === 'ENOENT') return false
              throw error
            }
          }

          function createRoute(runtime) {
            return async (request, response) => {
              const url = new URL(request.url ?? '/report-studio', 'http://dsh.local')
              try {
                if (url.pathname.startsWith('/report-studio/api/')) {
                  const sessionId = sessionIdFrom(url)
                  if (request.method === 'GET' && url.pathname === '/report-studio/api/health') {
                    return sendJson(response, 200, {
                      ok: true,
                      version: 'v0.1.0',
                      agentConfigured: true,
                      agentMode: 'dsh-native',
                      sessionId,
                      dataRoot: runtime.dataRoot,
                    })
                  }
                  if (request.method === 'GET' && url.pathname === '/report-studio/api/state') {
                    return sendJson(response, 200, await runtime.getState(sessionId))
                  }
                  if (request.method === 'POST' && url.pathname === '/report-studio/api/action') {
                    return sendJson(response, 200, await runtime.executeAction(sessionId, await readJson(request)))
                  }
                  if (request.method === 'POST' && url.pathname === '/report-studio/api/review/submit') {
                    return sendJson(response, 200, await runtime.submitReview(sessionId, await readJson(request)))
                  }
                  if (request.method === 'POST' && url.pathname === '/report-studio/api/agent/chat') {
                    return sendJson(response, 200, await runtime.prepareChat(sessionId, await readJson(request)))
                  }
                  const match = url.pathname.match(/^\/report-studio\/api\/proposal\/([^/]+)\/accept$/)
                  if (request.method === 'POST' && match) {
                    return sendJson(response, 200, await runtime.acceptProposal(sessionId, decodeURIComponent(match[1])))
                  }
                  return sendJson(response, 404, { error: 'not_found' })
                }
                if (await serveStatic(request, response, url)) return
                sendJson(response, 404, { error: 'not_found' })
              } catch (error) {
                sendJson(response, error?.statusCode || 400, { error: error?.message || 'request_failed' })
              }
            }
          }

          export function apply(ctx, config = {}) {
            const runtime = createStudioDshRuntime({ dataRoot: config.dataDir })
            registerTools(ctx, runtime)
            ctx.systemPrompt.section({
              name: 'report-studio-v0.1.0',
              order: 130,
              text: [
                'Report Studio v0.1.0 is available in this DSH Session.',
                'For Report Studio review tasks, call studio_get_context before proposing changes.',
                'Use studio_apply_commands only with the ReviewSubmission ID supplied by the user task.',
                'studio_apply_commands creates a Proposal for human confirmation and never directly commits Project State.',
              ].join('\n'),
            })
            ctx.effect(
              () => ctx.webServer.register({ kind: 'prefix', path: '/report-studio', handler: createRoute(runtime) }),
              'report-studio-dsh: web route',
            )
          }
          ''')

          write('packages/studio-dsh-plugin/lib/client.js', r'''
          window.__ModuleLoader__.load({
            id: '@architectureworld/report-studio-dsh',
            factory: (require) => {
              var module = { exports: {} }
              var exports = module.exports
              const React = require('react')

              const inject = ['slots', 'sessions']

              function resultMessage(result) {
                if (result?.ok) return { ok: true }
                const error = result?.error
                return {
                  ok: false,
                  error: error ? `${error.code || 'dsh_error'}: ${error.message || String(error)}` : 'DSH Session 拒绝了请求。',
                }
              }

              function usePromptBridge({ sessionId, sessions, source }) {
                React.useEffect(() => {
                  const onMessage = async event => {
                    const expected = source()
                    if (!expected || event.source !== expected || event.origin !== window.location.origin) return
                    const message = event.data
                    if (!message || message.type !== 'report-studio.prompt' || message.sessionId !== sessionId) return
                    const binding = sessions.binding(sessionId)
                    const session = binding?.session
                    let reply
                    if (!session) {
                      reply = { ok: false, error: '当前 DSH Session 不可用。' }
                    } else {
                      try {
                        const text = String(message.text || '').trim()
                        if (!text) throw new Error('Report Studio 提交了空任务。')
                        reply = resultMessage(await session.prompt([{ type: 'text', text }], 'queue'))
                      } catch (error) {
                        reply = { ok: false, error: error?.message || String(error) }
                      }
                    }
                    expected.postMessage({
                      type: 'report-studio.prompt-result',
                      requestId: message.requestId,
                      sessionId,
                      ...reply,
                    }, window.location.origin)
                  }
                  window.addEventListener('message', onMessage)
                  return () => window.removeEventListener('message', onMessage)
                }, [sessionId, sessions, source])
              }

              function ReportStudioView({ sessionId, sessions }) {
                const frameRef = React.useRef(null)
                const source = React.useCallback(() => frameRef.current?.contentWindow || null, [])
                usePromptBridge({ sessionId, sessions, source })
                return React.createElement('iframe', {
                  ref: frameRef,
                  src: `/report-studio/?sessionId=${encodeURIComponent(sessionId)}`,
                  title: 'Report Studio',
                  style: { width: '100%', height: '100%', minHeight: 0, border: 0, display: 'block', background: '#080b11' },
                  allow: 'clipboard-read; clipboard-write',
                })
              }

              function HeaderAction({ sessionId, sessions }) {
                const childRef = React.useRef(null)
                const source = React.useCallback(() => childRef.current && !childRef.current.closed ? childRef.current : null, [])
                usePromptBridge({ sessionId, sessions, source })
                return React.createElement('button', {
                  type: 'button',
                  title: '在独立窗口打开 Report Studio（仍绑定当前 DSH Session）',
                  onClick: () => {
                    childRef.current = window.open(
                      `/report-studio/?sessionId=${encodeURIComponent(sessionId)}`,
                      `report-studio-${sessionId}`,
                    )
                    childRef.current?.focus()
                  },
                  style: {
                    border: '1px solid rgba(255,255,255,.14)',
                    borderRadius: 8,
                    background: 'rgba(115,87,245,.16)',
                    color: 'inherit',
                    padding: '6px 10px',
                    cursor: 'pointer',
                    fontWeight: 650,
                  },
                }, 'Report Studio')
              }

              function apply(ctx) {
                const sessions = ctx.get('sessions')
                ctx.slots.inject('conversation.view', () => ctx.slots.register({
                  name: 'conversation.view',
                  id: 'report-studio',
                  order: 50,
                  label: 'Report Studio',
                }, props => React.createElement(ReportStudioView, { sessionId: props.sessionId, sessions })))
                ctx.slots.inject('conversation.session.header.actions', () => ctx.slots.register({
                  name: 'conversation.session.header.actions',
                  id: 'report-studio',
                  order: 70,
                  label: 'Report Studio',
                }, props => React.createElement(HeaderAction, { sessionId: props.sessionId, sessions })))
              }

              module.exports = { inject, apply }
              return module.exports
            },
          })
          ''')

          write('packages/studio-dsh-plugin/runtime.test.mjs', r'''
          import test from 'node:test'
          import assert from 'node:assert/strict'
          import { mkdtemp, rm } from 'node:fs/promises'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { createStudioDshRuntime } from './lib/runtime.js'

          test('native DSH runtime binds isolated Report Studio projects to session ids and creates proposals', async () => {
            const root = await mkdtemp(join(tmpdir(), 'report-studio-dsh-runtime-'))
            try {
              const runtime = createStudioDshRuntime({ dataRoot: root })
              let state = await runtime.executeAction('session-a', { type: 'outline.add', parentId: null, title: 'DSH 原生接入' })
              const nodeId = state.outline[0].id
              state = await runtime.executeAction('session-a', { type: 'annotation.add', scopeKey: 'outline:root', reviewRoundId: null, target: { type: 'outline-node', id: nodeId, label: 'DSH 原生接入' }, instruction: '将标题改为原生 DSH 工作台' })
              const submitted = await runtime.submitReview('session-a', { scopeKey: 'outline:root', reviewRoundId: null })
              assert.match(submitted.dshPrompt.text, /studio_get_context/)
              assert.match(submitted.dshPrompt.text, new RegExp(submitted.submission.id))
              const applied = await runtime.applyCommands('session-a', {
                submissionId: submitted.submission.id,
                message: '已形成标题修改建议',
                commands: [{ type: 'outline.rename', nodeId, title: '原生 DSH 工作台' }],
              })
              assert.equal(applied.status, 'pending')
              const sessionA = await runtime.getState('session-a')
              assert.equal(sessionA.proposals.length, 1)
              const sessionB = await runtime.getState('session-b')
              assert.equal(sessionB.outline.length, 0)
              assert.notEqual(sessionA.project.id, sessionB.project.id)
