            docs/deployment/report-studio-v0.1.0-local-deployment.md \
            docs/handoff/2026-09-02-report-studio-v0.1.0-runnable-handoff.md
          git rm .github/workflows/apply-native-dsh-integration.yml
          git diff --cached --check
          git status --short
          test -n "$(git diff --cached --name-only)"
