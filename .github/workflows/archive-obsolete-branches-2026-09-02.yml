name: Archive obsolete Report Studio branches 2026-09-02

on:
  push:
    branches:
      - ops/archive-obsolete-branches-2026-09-02

permissions:
  contents: write

concurrency:
  group: archive-obsolete-report-studio-branches-2026-09-02
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source refs, create archive tags, and delete active branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OPERATION_BRANCH: ${{ github.ref_name }}
          OPERATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          read_ref_sha() {
            local ref="$1"
            curl -fsSL "${headers[@]}" "${api}/git/ref/${ref}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])'
          }

          ensure_tag() {
            local tag="$1"
            local expected_sha="$2"
            local body
            local status
            local actual_sha
            local payload

            body="$(mktemp)"
            status="$(curl -sSL -o "${body}" -w '%{http_code}' "${headers[@]}" "${api}/git/ref/tags/${tag}")"

            if [ "${status}" = "200" ]; then
              actual_sha="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["sha"])' < "${body}")"
              if [ "${actual_sha}" != "${expected_sha}" ]; then
                echo "Archive tag ${tag} exists at ${actual_sha}, expected ${expected_sha}." >&2
                rm -f "${body}"
                exit 1
              fi
              rm -f "${body}"
              return
            fi

            if [ "${status}" != "404" ]; then
              cat "${body}" >&2
              rm -f "${body}"
              exit 1
            fi
            rm -f "${body}"

            payload="$(python3 - "${tag}" "${expected_sha}" <<'PY'
          import json
          import sys
          print(json.dumps({"ref": f"refs/tags/{sys.argv[1]}", "sha": sys.argv[2]}))
          PY
            )"
            curl -fsSL -X POST "${headers[@]}" \
              "${api}/git/refs" \
              -d "${payload}" >/dev/null
          }

          archive_branch() {
            local branch="$1"
            local expected_sha="$2"
            local tag="$3"
            local actual_sha

            actual_sha="$(read_ref_sha "heads/${branch}")"
            if [ "${actual_sha}" != "${expected_sha}" ]; then
              echo "Ref ${branch} moved to ${actual_sha}; expected ${expected_sha}. Refusing archival." >&2
              exit 1
            fi

            ensure_tag "${tag}" "${expected_sha}"
            curl -fsSL -X DELETE "${headers[@]}" \
              "${api}/git/refs/heads/${branch}" >/dev/null
          }

          archive_branch \
            "architecture/report-studio-storage-review" \
            "f0edb5c78811b246501f220259ae018bf4eb57eb" \
            "archive/architecture-report-studio-storage-review-2026-09-02"

          archive_branch \
            "feat/v0.1.0-outline-draft-usable" \
            "d744a3422512f7b418fb814c89c347b071fbe517" \
            "archive/feat-v0.1.0-outline-draft-usable-2026-09-02"

          ensure_tag \
            "ops/archive-obsolete-branches-2026-09-02" \
            "${OPERATION_SHA}"

          {
            echo '## Branch archival completed'
            echo
            echo '- `architecture/report-studio-storage-review` → `archive/architecture-report-studio-storage-review-2026-09-02` @ `f0edb5c78811b246501f220259ae018bf4eb57eb`'
            echo '- `feat/v0.1.0-outline-draft-usable` → `archive/feat-v0.1.0-outline-draft-usable-2026-09-02` @ `d744a3422512f7b418fb814c89c347b071fbe517`'
            echo '- Operation audit tag: `ops/archive-obsolete-branches-2026-09-02`'
          } >> "${GITHUB_STEP_SUMMARY}"

          curl -fsSL -X DELETE "${headers[@]}" \
            "${api}/git/refs/heads/${OPERATION_BRANCH}" >/dev/null
