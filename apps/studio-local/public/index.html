<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report Studio v0.1.0</title><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">RS</span><div><strong>Report Studio</strong><small>v0.1.0 · Outline + Draft</small></div></div><input id="project-title" class="project-title" aria-label="项目名称"><nav class="stage-tabs"><button data-stage="outline" class="active">大纲</button><button data-stage="draft">草案</button><button data-stage="layout" disabled>排版 <span>v0.2.0</span></button></nav><div class="revision-pill">Revision <b id="revision-number">0</b></div></header><main class="workspace"><section class="content-column"><div id="outline-stage" class="stage-view"></div><div id="draft-stage" class="stage-view" hidden></div></section><aside id="annotation-panel" class="annotation-panel"><div class="panel-head"><div><strong>批注</strong><small id="scope-label">整份大纲</small></div><span id="annotation-count" class="count">0</span></div><div id="review-history" class="review-history"></div><div class="composer"><div id="annotation-target" class="target-chip">目标：当前作用域</div><textarea id="annotation-input" rows="3" placeholder="输入需要 Agent 处理的问题…"></textarea><div class="composer-actions"><button id="add-annotation" class="ghost">添加批注</button><button id="submit-review" class="primary">提给Agent</button></div></div></aside></main></div><button id="agent-fab" class="agent-fab" title="项目 Agent"><span></span></button><div id="agent-modal" class="agent-modal" hidden><div class="agent-window"><div class="agent-head"><div><strong>项目 Agent</strong><small id="agent-status">检查 DSH Bridge…</small></div><button id="agent-close">×</button></div><div id="agent-feed" class="agent-feed"></div><div class="agent-compose"><textarea id="agent-input" rows="2" placeholder="向当前项目 Agent 提问…"></textarea><button id="agent-send" class="primary">发送</button></div></div></div><div id="toast" class="toast" hidden></div><script type="module" src="/app.js"></script></body></html>
